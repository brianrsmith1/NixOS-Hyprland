$bg = rgba(18, 18, 30, 0.88)
general {
    hide_cursor = true
    grace = 2
    no_fade_in = false
}
background {
    monitor =
    color = $bg
    blur_passes = 3
    blur_size = 6
}
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(205, 214, 244, 1.0)
    font_size = 82
    font_family = JetBrainsMono Nerd Font
    position = 0, 100
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color = rgba(166, 173, 200, 1.0)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 25
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 300, 54
    outline_thickness = 2
    outer_color = rgba(137, 180, 250, 1.0)
    inner_color = rgba(30, 30, 46, 0.92)
    font_color = rgba(205, 214, 244, 1.0)
    rounding = 14
    fade_on_empty = false
    placeholder_text = <span foreground="##a6adc8">  Password</span>
    position = 0, -40
    halign = center
    valign = center
}
