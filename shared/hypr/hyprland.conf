# NixOS Hyprland / ThinkPad Z16 Gen 1
# Catppuccin Mocha — restrained graphite appearance
# Reload: Super+Shift+R
$mod = SUPER
$terminal = kitty
$launcher = fuzzel
$fileManager = thunar

monitor = , preferred, auto, 1
workspace = 1, persistent:true
workspace = 2, persistent:true
workspace = 3, persistent:true
workspace = 4, persistent:true
workspace = 5, persistent:true

exec-once = waybar
exec-once = swaync
exec-once = hypridle
exec-once = hyprpaper
exec-once = sh -c 'if command -v polkit-gnome-authentication-agent-1 >/dev/null; then polkit-gnome-authentication-agent-1; elif [ -x /usr/libexec/polkit-gnome-authentication-agent-1 ]; then /usr/libexec/polkit-gnome-authentication-agent-1; fi'
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(a6adc8cc)
    col.inactive_border = rgba(45475a99)
    layout = dwindle
    allow_tearing = false
}

decoration {
    rounding = 10
    active_opacity = 0.97
    inactive_opacity = 0.94
    shadow {
        enabled = true
        range = 8
        render_power = 2
        color = rgba(11111bee)
    }
    blur {
        enabled = true
        size = 4
        passes = 2
        noise = 0.015
        contrast = 1.02
        vibrancy = 0.08
    }
}

animations {
    enabled = true
    bezier = smooth, 0.22, 1, 0.36, 1
    animation = windows, 1, 3, smooth, popin 92%
    animation = windowsOut, 1, 2, smooth, popin 92%
    animation = border, 1, 3, smooth
    animation = fade, 1, 3, smooth
    animation = workspaces, 1, 3, smooth, slide
}

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        tap-to-click = true
        drag_lock = true
        disable_while_typing = true
        scroll_factor = 0.45
    }
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vfr = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
}

$mainMod = $mod
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, SPACE, exec, $launcher
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, Q, killactive
bind = $mainMod, V, togglefloating
bind = $mainMod, F, fullscreen
bind = $mainMod, P, pseudo
bind = $mainMod, O, togglesplit
bind = $mainMod CTRL, L, exec, hyprlock
bind = $mainMod SHIFT, E, exit
bind = $mainMod SHIFT, R, exec, hyprctl reload
bind = $mainMod SHIFT, W, exec, bash ~/.config/hypr/scripts/wallpaper-cycle.sh
bind = $mainMod, C, exec, cliphist list | fuzzel --dmenu | cliphist decode | wl-copy
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | swappy -f -
bind = $mainMod, PRINT, exec, grim - | swappy -f -

# Vim-style focus and move
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

# Workspaces 1-5
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# ThinkPad media and brightness keys
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

windowrule = match:class ^(pavucontrol)$, float on
windowrule = match:class ^(blueman-manager)$, float on
windowrule = match:class ^(nm-connection-editor)$, float on
windowrule = match:class ^(org.gnome.Calculator)$, float on

env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland
env = GDK_BACKEND,wayland,x11
env = MOZ_ENABLE_WAYLAND,1
env = SDL_VIDEODRIVER,wayland
