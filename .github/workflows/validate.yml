name: Validate NixOS Hyprland configuration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-and-evaluation:
    name: Nix evaluation and shell syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Parse Nix expressions
        run: |
          nix-instantiate --parse flake.nix >/dev/null
          nix-instantiate --parse configuration.nix >/dev/null
      - name: Create CI-only hardware fixture
        run: |
          cat > hardware-configuration.nix <<'EOF'
          { ... }: {
            fileSystems."/" = {
              device = "/dev/disk/by-label/ci-root";
              fsType = "ext4";
            };
            fileSystems."/boot" = {
              device = "/dev/disk/by-label/ci-efi";
              fsType = "vfat";
            };
            boot.initrd.availableKernelModules = [ "nvme" "xhci_pci" "ahci" "usbhid" "usb_storage" ];
            boot.kernelModules = [ "kvm-amd" ];
          }
          EOF
          git add hardware-configuration.nix
      - name: Evaluate complete NixOS configuration
        run: nix eval --show-trace .#nixosConfigurations.z16-ci.config.system.build.toplevel.drvPath
      - name: Check shell syntax
        run: find . -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
